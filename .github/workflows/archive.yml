name: Archive 7-Day Fire Potential

on:
  schedule:
    # Times are UTC. Runs at about 3 am Mountain (New Mexico) time, year-round.
    # The forecast is issued 7 am - 12 pm, so a 3 am pull saves the previous day's
    # forecast under that day's issue date, after it has been finalized.
    #   09:05 UTC = 3:05 am MDT (summer)  -> runs
    #             = 2:05 am MST (winter)  -> skipped by the 3 am check
    #   10:05 UTC = 3:05 am MST (winter)  -> runs
    #             = 4:05 am MDT (summer)  -> already archived, skipped
    #   12:05 UTC = backup at 5-6 am, only saves if both earlier runs failed
    - cron: "5 9 * * *"
    - cron: "5 10 * * *"
    - cron: "5 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Replace today's archived forecast (use if the product was re-issued)"
        type: boolean
        default: false
      rescore:
        description: "Re-check all saved days with the current settings in config/criteria.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull 7-day forecast
        id: forecast
        continue-on-error: true
        run: |
          ARGS=""
          # Scheduled runs wait for 3 am Mountain; manual runs go any time.
          # Any run before 7 am Mountain saves the previous day's forecast.
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--not-before-hour 3"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/archive_forecast.py $ARGS

      - name: Check observed weather against High Risk criteria
        id: weather
        continue-on-error: true
        run: |
          if [ "${{ inputs.rescore }}" = "true" ]; then
            python scripts/verify_weather.py --rescore
          else
            python scripts/verify_weather.py
          fi

      - name: Commit results
        run: |
          git config user.name  "forecast-archiver"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Archive $(TZ=America/Denver date +%F)"
            git push
          fi

      - name: Flag any failed step
        if: steps.forecast.outcome == 'failure' || steps.weather.outcome == 'failure'
        run: |
          echo "Forecast step: ${{ steps.forecast.outcome }}   Weather step: ${{ steps.weather.outcome }}"
          exit 1
